name: Release

# Pushing a v* tag releases stagereg. Each job gates the next, and only the job that
# needs a privileged token gets one (the pattern of docs.yml). Publishing uses PyPI
# trusted publishing (OIDC), so no API token is stored in the repository.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  version-check:
    name: Check tag matches version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Compare tag with declared version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          declared="$(uv version --short)"
          if [ "${TAG#v}" != "$declared" ]; then
            echo "::error::Tag $TAG does not match the declared version $declared in pyproject.toml"
            exit 1
          fi
          echo "Tag $TAG matches the declared version $declared"

  verify:
    name: Verify
    needs: version-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --extra jax --group dev --group docs --group example-cmapss
      - name: Run pre-commit
        run: uv run pre-commit run --all-files
      - name: Run tests
        run: uv run pytest
      - name: Build docs
        run: uv run --extra jax --group docs mkdocs build --strict

  build:
    name: Build distribution
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Build wheel and sdist
        run: uv build --out-dir dist
      - name: Upload distribution
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/stagereg
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    needs: publish-testpypi
    runs-on: ubuntu-latest
    # Protected environment: the maintainer must approve this job before it runs.
    environment:
      name: pypi
      url: https://pypi.org/p/stagereg
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub Release
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create Release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --verify-tag
