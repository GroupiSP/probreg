site_name: probreg
site_description: Stage-oriented probabilistic regression
site_url: https://groupisp.github.io/probreg/
repo_url: https://github.com/GroupiSP/probreg
repo_name: GroupiSP/probreg
edit_uri: ""

# The published pages live apart from docs/, which holds ADRs and agent notes
# that are never published (ADR 0007).
docs_dir: docs_site

nav:
  - Home: index.md
  - Glossary: glossary.md

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - toc.follow
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets:
      # Includes resolve from the repo root, so pages can pull in README.md and
      # GLOSSARY.md, which sit outside docs_dir. A missing include fails the build.
      base_path: ["."]
      check_paths: true

plugins:
  - search
